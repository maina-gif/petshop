<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tutores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-people"></i> Tutores</h1>
        <a th:href="@{/tutores/novo}" class="btn btn-pet"><i class="bi bi-plus-lg"></i> Novo tutor</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- busca por nome -->
    <form th:action="@{/tutores}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-sm-8 col-md-6">
            <label for="busca" class="visually-hidden">Buscar por nome</label>
            <input type="search" id="busca" name="nome" th:value="${nome}" class="form-control" placeholder="Buscar por nome...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
            <a th:if="${!#strings.isEmpty(nome)}" th:href="@{/tutores}" class="btn btn-link">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm border-0">
        <div th:if="${#lists.isEmpty(tutores)}" class="p-4 text-center text-muted">
            <span th:text="${#strings.isEmpty(nome)} ? 'Nenhum tutor cadastrado ainda.' : 'Nenhum tutor encontrado para essa busca.'">Vazio</span>
        </div>
        <div th:unless="${#lists.isEmpty(tutores)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Telefone</th>
                    <th scope="col" class="d-none d-md-table-cell">E-mail</th>
                    <th scope="col">CPF</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tutores}">
                    <td class="fw-semibold" th:text="${t.nome}">Fulano</td>
                    <td th:text="${t.telefone}">(31) 99999-9999</td>
                    <td class="d-none d-md-table-cell" th:text="${t.email}">email</td>
                    <!-- cpf mascarado -->
                    <td th:text="${@fmt.cpfMascarado(t.cpf)}">***.***.000-00</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/tutores/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="bi bi-pencil"></i><span class="visually-hidden">Editar</span></a>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-excluir" title="Excluir"
                                th:data-url="@{/tutores/excluir/{id}(id=${t.id})}" th:data-nome="${t.nome}">
                            <i class="bi bi-trash"></i><span class="visually-hidden">Excluir</span></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: modalExcluir}"></div>
<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
