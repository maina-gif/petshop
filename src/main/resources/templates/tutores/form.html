<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tutor.id == null ? 'Novo tutor' : 'Editar tutor'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4" style="max-width: 760px">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/tutores}">Tutores</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${tutor.id == null} ? 'Novo' : 'Editar'">Novo</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3" th:text="${tutor.id == null} ? 'Novo tutor' : 'Editar tutor'">Novo tutor</h1>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/tutores/salvar}" th:object="${tutor}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-12">
                        <label for="nome" class="form-label">Nome *</label>
                        <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" maxlength="120" required>
                        <div class="invalid-feedback" th:errors="*{nome}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="cpf" class="form-label">CPF *</label>
                        <input type="text" th:field="*{cpf}" class="form-control mask-cpf" th:errorclass="is-invalid"
                               placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
                        <div class="invalid-feedback" th:errors="*{cpf}">erro</div>
                        <div class="form-text"><i class="bi bi-shield-lock"></i> Armazenado criptografado.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone *</label>
                        <input type="text" th:field="*{telefone}" class="form-control mask-telefone" th:errorclass="is-invalid"
                               placeholder="(31) 99999-9999" inputmode="tel" maxlength="15" required>
                        <div class="invalid-feedback" th:errors="*{telefone}">erro</div>
                        <div class="form-text"><i class="bi bi-shield-lock"></i> Armazenado criptografado.</div>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label">E-mail *</label>
                        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{email}">erro</div>
                    </div>
                    <div class="col-12">
                        <label for="endereco" class="form-label">Endereço</label>
                        <input type="text" th:field="*{endereco}" class="form-control" maxlength="200">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-pet"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/tutores}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
