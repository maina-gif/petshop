<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- head -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <title th:text="${titulo} + ' | Pet Shop'">Pet Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- menu -->
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-pet shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <span aria-hidden="true">🐾</span> Pet Shop
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${menu == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2"></i> Painel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${menu == 'tutores'} ? 'active'" th:href="@{/tutores}">
                        <i class="bi bi-people"></i> Tutores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${menu == 'pets'} ? 'active'" th:href="@{/pets}">
                        <span aria-hidden="true">🐾</span> Pets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${menu == 'produtos'} ? 'active'" th:href="@{/produtos}">
                        <i class="bi bi-box-seam"></i> Produtos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${menu == 'agendamentos'} ? 'active'" th:href="@{/agendamentos}">
                        <i class="bi bi-calendar-check"></i> Agendamentos</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name">usuário</span>
                </span>
                <!-- logout precisa ser POST por causa do CSRF -->
                <form th:action="@{/logout}" method="post" id="formLogout" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- mensagens de sucesso/erro -->
<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${sucesso}">ok</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${erro}">erro</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<!-- modal de excluir (usado em todas as listas) -->
<div th:fragment="modalExcluir" class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="tituloExcluir" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloExcluir">Confirmar exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                Tem certeza que deseja excluir <strong id="nomeExcluir">este registro</strong>? Essa ação não pode ser desfeita.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formExcluir" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- aviso de sessao expirando -->
<div th:fragment="avisoSessao" id="avisoSessao" class="aviso-sessao shadow" role="status" aria-live="polite" hidden>
    <i class="bi bi-hourglass-split"></i>
    Sua sessão vai expirar em <strong id="contagemSessao">5</strong>s por inatividade.
    Mexa o mouse ou aperte uma tecla para continuar.
</div>

<!-- scripts -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/inatividade.js}"></script>
</th:block>

</body>
</html>
