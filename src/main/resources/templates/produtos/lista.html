<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-box-seam"></i> Produtos</h1>
        <a th:href="@{/produtos/novo}" class="btn btn-pet"><i class="bi bi-plus-lg"></i> Novo produto</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <form th:action="@{/produtos}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-sm-8 col-md-6">
            <label for="busca" class="visually-hidden">Buscar por nome</label>
            <input type="search" id="busca" name="nome" th:value="${nome}" class="form-control" placeholder="Buscar produto por nome...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
            <a th:if="${!#strings.isEmpty(nome)}" th:href="@{/produtos}" class="btn btn-link">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm border-0">
        <div th:if="${#lists.isEmpty(produtos)}" class="p-4 text-center text-muted">
            <span th:text="${#strings.isEmpty(nome)} ? 'Nenhum produto cadastrado ainda.' : 'Nenhum produto encontrado para essa busca.'">Vazio</span>
        </div>
        <div th:unless="${#lists.isEmpty(produtos)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Produto</th>
                    <th scope="col" class="text-end">Preço</th>
                    <th scope="col" class="text-end">Estoque</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}">
                    <td class="fw-semibold" th:text="${p.nome}">Ração</td>
                    <td class="text-end" th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                    <td class="text-end">
                        <!-- estoque baixo fica em destaque -->
                        <span th:text="${p.estoque}"
                              th:class="${p.estoque == 0 ? 'badge text-bg-danger' : (p.estoque lt 5 ? 'badge text-bg-warning' : '')}">10</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="bi bi-pencil"></i><span class="visually-hidden">Editar</span></a>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-excluir" title="Excluir"
                                th:data-url="@{/produtos/excluir/{id}(id=${p.id})}" th:data-nome="${p.nome}">
                            <i class="bi bi-trash"></i><span class="visually-hidden">Excluir</span></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: modalExcluir}"></div>
<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
