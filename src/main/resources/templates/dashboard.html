<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Painel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h1 class="h3 mb-0">Olá, <span sec:authentication="name">usuário</span>!</h1>
            <p class="text-muted mb-0">Resumo de hoje, <span th:text="${#temporals.format(hoje, 'dd/MM/yyyy')}">01/01/2026</span></p>
        </div>
        <a th:href="@{/agendamentos/novo}" class="btn btn-pet"><i class="bi bi-plus-lg"></i> Novo agendamento</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- cards de resumo -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <a th:href="@{/tutores}" class="card card-resumo text-decoration-none h-100">
                <div class="card-body">
                    <i class="bi bi-people icone-resumo text-primary"></i>
                    <div class="numero" th:text="${totalTutores}">0</div>
                    <div class="text-muted small">Clientes (tutores)</div>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/pets}" class="card card-resumo text-decoration-none h-100">
                <div class="card-body">
                    <span class="icone-resumo" aria-hidden="true">🐾</span>
                    <div class="numero" th:text="${totalPets}">0</div>
                    <div class="text-muted small">Pets</div>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/agendamentos(data=${hoje})}" class="card card-resumo text-decoration-none h-100">
                <div class="card-body">
                    <i class="bi bi-calendar-check icone-resumo text-success"></i>
                    <div class="numero" th:text="${#lists.size(agendamentosHoje)}">0</div>
                    <div class="text-muted small">Agendamentos hoje</div>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/produtos}" class="card card-resumo text-decoration-none h-100">
                <div class="card-body">
                    <i class="bi bi-box-seam icone-resumo text-warning"></i>
                    <div class="numero" th:text="${totalProdutos}">0</div>
                    <div class="text-muted small">Produtos</div>
                </div>
            </a>
        </div>
    </div>

    <!-- agenda do dia -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-semibold">
            <i class="bi bi-clock"></i> Agenda de hoje
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(agendamentosHoje)}" class="p-4 text-center text-muted">
                Nenhum agendamento para hoje.
            </div>
            <div th:unless="${#lists.isEmpty(agendamentosHoje)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Horário</th>
                        <th scope="col">Pet</th>
                        <th scope="col">Tutor</th>
                        <th scope="col">Serviço</th>
                        <th scope="col">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${agendamentosHoje}">
                        <td class="fw-semibold" th:text="${#temporals.format(a.horario, 'HH:mm')}">09:00</td>
                        <td th:text="${a.pet.nome}">Rex</td>
                        <td th:text="${a.pet.tutor.nome}">Fulano</td>
                        <td th:text="${@fmt.servico(a.servico)}">Banho</td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${@fmt.corStatus(a.status)}"
                                  th:text="${@fmt.status(a.status)}">Agendado</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
