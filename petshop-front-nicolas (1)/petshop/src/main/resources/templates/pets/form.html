<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pet.id == null ? 'Novo pet' : 'Editar pet'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4" style="max-width: 760px">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/pets}">Pets</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${pet.id == null} ? 'Novo' : 'Editar'">Novo</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3" th:text="${pet.id == null} ? 'Novo pet' : 'Editar pet'">Novo pet</h1>

    <!-- sem tutor não tem como cadastrar pet -->
    <div th:if="${#lists.isEmpty(tutores)}" class="alert alert-warning">
        <i class="bi bi-info-circle"></i> Cadastre um tutor antes de cadastrar pets.
        <a th:href="@{/tutores/novo}" class="alert-link">Cadastrar tutor</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/pets/salvar}" th:object="${pet}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome *</label>
                        <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" maxlength="80" required>
                        <div class="invalid-feedback" th:errors="*{nome}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="tutorId" class="form-label">Tutor *</label>
                        <select th:field="*{tutorId}" class="form-select" th:errorclass="is-invalid" required>
                            <option value="">Selecione...</option>
                            <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome}">Fulano</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tutorId}">erro</div>
                    </div>
                    <div class="col-md-4">
                        <label for="especie" class="form-label">Espécie *</label>
                        <input type="text" th:field="*{especie}" class="form-control" th:errorclass="is-invalid"
                               list="listaEspecies" placeholder="Cachorro, Gato..." required>
                        <datalist id="listaEspecies">
                            <option value="Cachorro"><option value="Gato"><option value="Pássaro"><option value="Roedor"><option value="Outro">
                        </datalist>
                        <div class="invalid-feedback" th:errors="*{especie}">erro</div>
                    </div>
                    <div class="col-md-5">
                        <label for="raca" class="form-label">Raça</label>
                        <input type="text" th:field="*{raca}" class="form-control" maxlength="60">
                    </div>
                    <div class="col-md-3">
                        <label for="idade" class="form-label">Idade (anos)</label>
                        <input type="number" th:field="*{idade}" class="form-control" th:errorclass="is-invalid" min="0" max="40">
                        <div class="invalid-feedback" th:errors="*{idade}">erro</div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-pet" th:disabled="${#lists.isEmpty(tutores)}">
                        <i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/pets}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
