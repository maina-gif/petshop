<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pets')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0"><span aria-hidden="true">🐾</span> Pets</h1>
        <a th:href="@{/pets/novo}" class="btn btn-pet"><i class="bi bi-plus-lg"></i> Novo pet</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <form th:action="@{/pets}" method="get" class="row g-2 mb-3" role="search">
        <div class="col-sm-8 col-md-6">
            <label for="busca" class="visually-hidden">Buscar por nome</label>
            <input type="search" id="busca" name="nome" th:value="${nome}" class="form-control" placeholder="Buscar pet por nome...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
            <a th:if="${!#strings.isEmpty(nome)}" th:href="@{/pets}" class="btn btn-link">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm border-0">
        <div th:if="${#lists.isEmpty(pets)}" class="p-4 text-center text-muted">
            <span th:text="${#strings.isEmpty(nome)} ? 'Nenhum pet cadastrado ainda.' : 'Nenhum pet encontrado para essa busca.'">Vazio</span>
        </div>
        <div th:unless="${#lists.isEmpty(pets)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Espécie</th>
                    <th scope="col" class="d-none d-md-table-cell">Raça</th>
                    <th scope="col" class="d-none d-sm-table-cell">Idade</th>
                    <th scope="col">Tutor</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pets}">
                    <td class="fw-semibold" th:text="${p.nome}">Rex</td>
                    <td th:text="${p.especie}">Cachorro</td>
                    <td class="d-none d-md-table-cell" th:text="${p.raca} ?: '-'">SRD</td>
                    <td class="d-none d-sm-table-cell"
                        th:text="${p.idade == null ? '-' : p.idade + (p.idade == 1 ? ' ano' : ' anos')}">3 anos</td>
                    <td th:text="${p.tutor.nome}">Fulano</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/pets/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="bi bi-pencil"></i><span class="visually-hidden">Editar</span></a>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-excluir" title="Excluir"
                                th:data-url="@{/pets/excluir/{id}(id=${p.id})}" th:data-nome="${p.nome}">
                            <i class="bi bi-trash"></i><span class="visually-hidden">Excluir</span></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: modalExcluir}"></div>
<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
