<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agendamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0"><i class="bi bi-calendar-check"></i> Agendamentos</h1>
        <a th:href="@{/agendamentos/novo}" class="btn btn-pet"><i class="bi bi-plus-lg"></i> Novo agendamento</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- filtro por data -->
    <form th:action="@{/agendamentos}" method="get" class="row g-2 mb-3 align-items-end">
        <div class="col-auto">
            <label for="data" class="form-label small mb-1">Filtrar por data</label>
            <input type="date" id="data" name="data" th:value="${data}" class="form-control">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel"></i> Filtrar</button>
            <a th:if="${data != null}" th:href="@{/agendamentos}" class="btn btn-link">Ver todos</a>
        </div>
    </form>

    <div class="card shadow-sm border-0">
        <div th:if="${#lists.isEmpty(agendamentos)}" class="p-4 text-center text-muted">
            <span th:text="${data == null} ? 'Nenhum agendamento cadastrado ainda.' : 'Nenhum agendamento nessa data.'">Vazio</span>
        </div>
        <div th:unless="${#lists.isEmpty(agendamentos)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Data</th>
                    <th scope="col">Horário</th>
                    <th scope="col">Pet</th>
                    <th scope="col" class="d-none d-md-table-cell">Tutor</th>
                    <th scope="col">Serviço</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${agendamentos}" th:classappend="${a.status.name() == 'CANCELADO'} ? 'text-muted linha-cancelada'">
                    <td th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td class="fw-semibold" th:text="${#temporals.format(a.horario, 'HH:mm')}">09:00</td>
                    <td th:text="${a.pet.nome}">Rex</td>
                    <td class="d-none d-md-table-cell" th:text="${a.pet.tutor.nome}">Fulano</td>
                    <td th:text="${@fmt.servico(a.servico)}">Banho</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${@fmt.corStatus(a.status)}"
                              th:text="${@fmt.status(a.status)}">Agendado</span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/agendamentos/editar/{id}(id=${a.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="bi bi-pencil"></i><span class="visually-hidden">Editar</span></a>
                        <button type="button" class="btn btn-sm btn-outline-danger btn-excluir" title="Excluir"
                                th:data-url="@{/agendamentos/excluir/{id}(id=${a.id})}"
                                th:data-nome="'o agendamento de ' + ${a.pet.nome}">
                            <i class="bi bi-trash"></i><span class="visually-hidden">Excluir</span></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: modalExcluir}"></div>
<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
