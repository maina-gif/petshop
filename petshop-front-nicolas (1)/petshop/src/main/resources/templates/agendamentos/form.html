<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${agendamento.id == null ? 'Novo agendamento' : 'Editar agendamento'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4" style="max-width: 760px">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/agendamentos}">Agendamentos</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${agendamento.id == null} ? 'Novo' : 'Editar'">Novo</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3" th:text="${agendamento.id == null} ? 'Novo agendamento' : 'Editar agendamento'">Novo agendamento</h1>

    <div th:if="${#lists.isEmpty(pets)}" class="alert alert-warning">
        <i class="bi bi-info-circle"></i> Cadastre um pet antes de agendar.
        <a th:href="@{/pets/novo}" class="alert-link">Cadastrar pet</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/agendamentos/salvar}" th:object="${agendamento}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <!-- erros de regra de negócio (horário ocupado, data no passado) -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle"></i>
                    <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">erro</span>
                </div>

                <div class="row g-3">
                    <div class="col-12">
                        <label for="petId" class="form-label">Pet *</label>
                        <select th:field="*{petId}" class="form-select" th:errorclass="is-invalid" required>
                            <option value="">Selecione...</option>
                            <option th:each="p : ${pets}" th:value="${p.id}"
                                    th:text="${p.nome} + ' (tutor: ' + ${p.tutor.nome} + ')'">Rex</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{petId}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="data" class="form-label">Data *</label>
                        <input type="date" th:field="*{data}" class="form-control" th:errorclass="is-invalid"
                               th:min="${agendamento.id == null} ? ${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}" required>
                        <div class="invalid-feedback" th:errors="*{data}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="horario" class="form-label">Horário *</label>
                        <input type="time" th:field="*{horario}" class="form-control" th:errorclass="is-invalid"
                               min="08:00" max="18:00" step="1800" required>
                        <div class="invalid-feedback" th:errors="*{horario}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="servico" class="form-label">Serviço *</label>
                        <select th:field="*{servico}" class="form-select" th:errorclass="is-invalid" required>
                            <option value="">Selecione...</option>
                            <option th:each="s : ${servicos}" th:value="${s}" th:text="${@fmt.servico(s)}">Banho</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{servico}">erro</div>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label">Status *</label>
                        <select th:field="*{status}" class="form-select" th:errorclass="is-invalid" required>
                            <option th:each="s : ${statusList}" th:value="${s}" th:text="${@fmt.status(s)}">Agendado</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{status}">erro</div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-pet" th:disabled="${#lists.isEmpty(pets)}">
                        <i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/agendamentos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: avisoSessao}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
