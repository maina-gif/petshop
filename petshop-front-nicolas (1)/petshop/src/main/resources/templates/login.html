<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="pagina-login">

<main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="logo-login" aria-hidden="true">🐾</div>
                        <h1 class="h4 fw-bold mb-1">Pet Shop</h1>
                        <p class="text-muted small mb-0">Sistema de gestão – acesso restrito</p>
                    </div>

                    <!-- mensagens que o back manda pela URL -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-x-circle"></i> Usuário ou senha inválidos.
                    </div>
                    <div th:if="${param.expirado}" class="alert alert-warning py-2 small" role="alert">
                        <i class="bi bi-clock-history"></i> Sua sessão expirou por inatividade. Entre novamente.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-box-arrow-left"></i> Você saiu do sistema.
                    </div>

                    <!-- th:action ja coloca o token csrf -->
                    <form th:action="@{/login}" method="post" novalidate class="needs-validation">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control"
                                       autocomplete="username" required autofocus>
                                <div class="invalid-feedback">Informe o usuário.</div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control"
                                       autocomplete="current-password" required>
                                <button type="button" class="btn btn-outline-secondary" id="mostrarSenha"
                                        aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                                <div class="invalid-feedback">Informe a senha.</div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-pet w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">
                Por segurança, a sessão encerra após 30 segundos sem atividade.
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    // botão de olho pra mostrar/esconder a senha
    document.getElementById('mostrarSenha').addEventListener('click', function () {
        const campo = document.getElementById('password');
        const mostrando = campo.type === 'text';
        campo.type = mostrando ? 'password' : 'text';
        this.innerHTML = mostrando ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        this.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Esconder senha');
    });
</script>
</body>
</html>
